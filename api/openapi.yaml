openapi: 3.0.3

info:
  title: Learn The Grammar API
  version: 0.1.0
  description: >
    Contract for the backend API consumed by the frontend. This is the
    single source of truth: server types (backend/internal/api) and the
    frontend client (frontend/src/api) are generated from this file.
    Infrastructure-only endpoints (e.g. /health) are intentionally not
    part of this contract.

paths:
  /api/hello:
    get:
      operationId: getHello
      summary: Returns a greeting message.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelloResponse"

components:
  schemas:
    HelloResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
