apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: learn-the-grammar
spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: learn-the-grammar-frontend:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 80
