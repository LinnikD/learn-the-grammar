apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: learn-the-grammar
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER
              value: "ltg"
            - name: POSTGRES_DB
              value: "ltg"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data

          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ltg", "-d", "ltg"]
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "ltg", "-d", "ltg"]
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
