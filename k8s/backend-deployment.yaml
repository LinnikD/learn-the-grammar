apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: learn-the-grammar
spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: learn-the-grammar-backend:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
