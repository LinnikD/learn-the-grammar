apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: learn-the-grammar
spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      initContainers:
        - name: migrate
          image: learn-the-grammar-backend:dev
          imagePullPolicy: Never
          command: ["./migrate", "up"]
          env:
            - name: LTG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database-url

      containers:
        - name: backend
          image: learn-the-grammar-backend:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080

          env:
            - name: LTG_PORT
              value: "8080"
            - name: LTG_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-session
                  key: signing-key
            - name: LTG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database-url

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 128Mi
