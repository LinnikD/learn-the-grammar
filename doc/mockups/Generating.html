<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Generating lesson</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Caveat:wght@700&display=swap">
<style>
:root{
  --bg:#F6F5F1; --surface:#FFFFFF; --border:#E3E1DA;
  --text:#201F1C; --text-secondary:#6B6862;
  --accent:#2C5F8A; --accent-dark:#1F4763; --accent-soft:#E8F0F6;
  --gold:#C99A3B;
  --radius:12px;
  --font-display:'Sora', system-ui, sans-serif;
  --font-body:'Plus Jakarta Sans', system-ui, sans-serif;
  --font-hand:'Caveat', cursive;
}
body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--text);}
h1,h2,h3{font-family:var(--font-display);margin:0;}
a{color:var(--accent);text-decoration:none;}
.nav{height:72px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 40px;justify-content:space-between;box-sizing:border-box;}
.nav-left{display:flex;align-items:center;gap:40px;}
.logo-mark{display:flex;flex-direction:column;}
.logo-text{font-family:var(--font-hand);font-weight:700;font-size:28px;color:var(--accent-dark);line-height:1;}
.logo-swash{display:block;margin-top:-3px;}
.nav-links{display:flex;gap:28px;}
.nav-link{font-size:14px;font-weight:600;color:var(--text-secondary);padding:8px 0;border-bottom:2px solid transparent;}
.nav-link.active{color:var(--text);border-bottom-color:var(--accent);}
.nav-right{display:flex;align-items:center;gap:16px;}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-dark);}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
.label{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-secondary);}
.sentences-card{display:flex;flex-direction:column;}
.sent-row{padding:18px 26px;display:flex;flex-direction:column;gap:10px;}
.sent-row + .sent-row{border-top:1px solid var(--border);}
.skel{background:#E9E7E1;border-radius:6px;}
.skel-line{height:16px;}
.skel-box{height:52px;border-radius:8px;}
.spinner{width:38px;height:38px;border-radius:50%;border:4px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div style="width:1440px;height:900px;box-sizing:border-box;position:relative;overflow:hidden;background:var(--bg);font-family:var(--font-body);">

  <div style="filter:saturate(.6) brightness(.98);pointer-events:none;user-select:none;" aria-hidden="true">
    <nav class="nav">
      <div class="nav-left">
        <div class="logo-mark">
          <span class="logo-text">Learn the Grammar</span>
          <svg class="logo-swash" width="150" height="8" viewBox="0 0 300 18"><path d="M4 8c40-10 220-10 292 4" stroke="var(--gold)" stroke-width="4" stroke-linecap="round" fill="none"/></svg>
        </div>
        <div class="nav-links">
          <a class="nav-link active" href="#">Lesson</a>
          <a class="nav-link" href="Dictionary.html">Dictionary</a>
          <a class="nav-link" href="Profile.html">Profile</a>
        </div>
      </div>
      <div class="nav-right">
        <span class="pill">Level A2</span>
        <div class="avatar">DN</div>
      </div>
    </nav>

    <main style="display:flex;justify-content:center;padding:56px 40px 80px;">
      <div style="width:100%;max-width:820px;display:flex;flex-direction:column;gap:28px;">

        <div>
          <div class="skel skel-line" style="width:180px;height:11px;"></div>
          <div class="skel skel-line" style="width:320px;height:26px;margin-top:12px;"></div>
          <div class="skel skel-line" style="width:520px;margin-top:12px;"></div>
        </div>

        <div class="card sentences-card">
          <div class="sent-row">
            <div style="display:flex;gap:14px;align-items:center;">
              <div class="skel" style="width:28px;height:28px;border-radius:50%;flex-shrink:0;"></div>
              <div class="skel skel-line" style="width:70%;"></div>
            </div>
            <div class="skel skel-box"></div>
          </div>
          <div class="sent-row">
            <div style="display:flex;gap:14px;align-items:center;">
              <div class="skel" style="width:28px;height:28px;border-radius:50%;flex-shrink:0;"></div>
              <div class="skel skel-line" style="width:55%;"></div>
            </div>
            <div class="skel skel-box"></div>
          </div>
          <div class="sent-row">
            <div style="display:flex;gap:14px;align-items:center;">
              <div class="skel" style="width:28px;height:28px;border-radius:50%;flex-shrink:0;"></div>
              <div class="skel skel-line" style="width:80%;"></div>
            </div>
            <div class="skel skel-box"></div>
          </div>
          <div class="sent-row">
            <div style="display:flex;gap:14px;align-items:center;">
              <div class="skel" style="width:28px;height:28px;border-radius:50%;flex-shrink:0;"></div>
              <div class="skel skel-line" style="width:60%;"></div>
            </div>
            <div class="skel skel-box"></div>
          </div>
          <div class="sent-row">
            <div style="display:flex;gap:14px;align-items:center;">
              <div class="skel" style="width:28px;height:28px;border-radius:50%;flex-shrink:0;"></div>
              <div class="skel skel-line" style="width:65%;"></div>
            </div>
            <div class="skel skel-box"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div style="position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(32,31,28,.38);display:flex;align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:16px;padding:40px 48px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:0 20px 60px rgba(32,31,28,.28);min-width:320px;">
      <div class="spinner"></div>
      <div style="font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--text);">Generating your sentences&hellip;</div>
      <div style="font-size:14px;color:var(--text-secondary);text-align:center;max-width:260px;">Picking words from your dictionary. Usually takes just a few seconds.</div>
      <a href="Lesson.html" style="margin-top:6px;font-size:12px;font-weight:600;color:var(--text-secondary);">Continue to lesson &rarr;</a>
    </div>
  </div>

</div>
</body>
</html>
