# Example backend configuration file, showing all fields at their
# default values. Copy it and pass its path via the `-config` flag
# or the LTG_CONFIG_FILE environment variable.
port: 8080

# Signs session tokens (see internal/session). If left empty, the
# server generates a random secret on each startup, which is fine for
# local development but means every restart invalidates existing
# sessions — set this explicitly for any long-lived deployment.
session_secret: ""

# PostgreSQL connection string (see internal/db). Nothing consumes it
# yet; it exists so features that need persistence can read it from
# configuration instead of adding their own loading logic.
database_url: ""
